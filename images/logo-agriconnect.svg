<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Deep Forest to Lush Emerald Background Gradient -->
    <linearGradient id="acBgGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d3b10" />
      <stop offset="48%" stop-color="#1e6b16" />
      <stop offset="100%" stop-color="#3eb31b" />
    </linearGradient>

    <!-- Golden Harvest Sun & Network Node Gradient -->
    <linearGradient id="acGoldGrad" x1="25" y1="20" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Fresh Leaf Highlight Gradient -->
    <linearGradient id="acLeafGrad" x1="32" y1="26" x2="88" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfccb" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Cold-Chain & Blockchain Cyber-Mint Accent -->
    <linearGradient id="acCyberGrad" x1="20" y1="70" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="acGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#062108" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#acBgGrad)" />
  <rect x="9" y="9" width="102" height="102" rx="25" stroke="#bbf7d0" stroke-opacity="0.32" stroke-width="1.8" />

  <!-- Subtle Blockchain Hexagon Shield Frame Inside -->
  <polygon points="60,17 96,37 96,81 60,101 24,81 24,37" fill="#ffffff" fill-opacity="0.05" stroke="url(#acGoldGrad)" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="5 3" />

  <!-- Golden Sun / Escrow Trust Halo at Top -->
  <circle cx="60" cy="34" r="9.5" fill="url(#acGoldGrad)" filter="url(#acGlow)" />
  <path d="M45 34C49 24 71 24 75 34" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Stylized "A" + Twin Organic Leaves & Connectivity Bridge ("C") -->
  <g filter="url(#acGlow)">
    <!-- Left Ascending Leaf-Pillar of 'A' -->
    <path d="M31 86C31 61 44 40 60 27C55 47 47 67 42 86H31Z" fill="url(#acLeafGrad)" />

    <!-- Right Sweeping Leaf & Fruit Crown of 'A' -->
    <path d="M89 86C89 61 76 40 60 27C65 47 73 67 78 86H89Z" fill="#ffffff" fill-opacity="0.92" />

    <!-- Central Sprouting Leaf Heart -->
    <path d="M60 42C51 52 51 67 60 76C69 67 69 52 60 42Z" fill="url(#acGoldGrad)" />
    <path d="M60 47V73" stroke="#14532d" stroke-width="2.2" stroke-linecap="round" />

    <!-- Dynamic Connecting Orbit Bridge ('Connect' Arc across the A) -->
    <path d="M25 69C44 83 76 83 95 69" stroke="url(#acGoldGrad)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M32 76C49 87 71 87 88 76" stroke="url(#acCyberGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- 3 Regional Connection Nodes (Farmer -> Cold-Chain Hub -> Urban Consumer) -->
  <circle cx="25" cy="69" r="4.5" fill="#fef08a" stroke="#0d3b10" stroke-width="2" />
  <circle cx="60" cy="79" r="5" fill="#38bdf8" stroke="#0d3b10" stroke-width="2" />
  <circle cx="95" cy="69" r="4.5" fill="#fef08a" stroke="#0d3b10" stroke-width="2" />
</svg>
